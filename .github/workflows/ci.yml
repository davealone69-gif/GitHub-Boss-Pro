name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Ensure Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "Wrapper jar missing — installing Gradle 8.9"
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''

      - name: Build Debug APK
        run: ${{ env.GRADLE_CMD }} :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: github-boss-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-latest-apk:
    name: Publish latest Android debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: github-boss-pro-debug-apk
          path: release-apk
      - name: Stage stable APK filename
        run: |
          set -euo pipefail
          apk="$(find release-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" release-apk/latest-debug.apk
      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: Latest Android debug build #${{ github.run_number }}
          body: |
            Automated debug/test APK from commit ${{ github.sha }}.
            This is not a production-signed release.
          files: release-apk/latest-debug.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
