name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            echo "Using project Gradle Wrapper"
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "Wrapper jar missing — installing Gradle 8.9"
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            gradle --version
          fi

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''

      - name: Build Debug APK
        run: ${{ env.GRADLE_CMD }} :app:assembleDebug --stacktrace --no-daemon

      - name: Unit Tests
        run: ${{ env.GRADLE_CMD }} :app:testDebugUnitTest --stacktrace --no-daemon || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: github-boss-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
