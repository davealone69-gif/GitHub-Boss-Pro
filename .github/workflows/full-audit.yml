name: Full Repository Audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Whole repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Ensure usable Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "Gradle wrapper is missing or corrupt; using a clean Gradle 8.9 distribution."
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Gradle audit and build
        shell: bash
        run: |
          set -euo pipefail
          "$GRADLE_CMD" lint test assembleDebug --continue --stacktrace --console=plain

      - name: Node audit and test
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
          npm run test --if-present
          npm run lint --if-present
          npm run build --if-present

      - name: Python syntax audit
        if: ${{ hashFiles('**/*.py') != '' }}
        shell: bash
        run: |
          python -m compileall -q .

