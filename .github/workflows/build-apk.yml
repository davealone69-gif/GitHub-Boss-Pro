name: Build APK (self)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "libs/**"
      - "buildSrc/**"
      - "gradle/**"
      - "*.gradle.kts"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build GitHub-Boss-Pro APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "Wrapper jar missing — installing Gradle 8.9"
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Assemble Debug APK
        run: ${{ env.GRADLE_CMD }} :app:assembleDebug --stacktrace --no-daemon

      - name: Assemble Release APK
        run: ${{ env.GRADLE_CMD }} :app:assembleRelease --stacktrace --no-daemon || true

      - name: Bundle Release AAB
        run: ${{ env.GRADLE_CMD }} :app:bundleRelease --stacktrace --no-daemon || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: github-boss-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: github-boss-pro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

  publish-latest-apk:
    name: Publish latest APK download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-boss-pro-debug-apk
          path: release-apk
      - name: Stage direct APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-apk -type f -name '*.apk' -path '*debug*' -print -quit)"
          test -n "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/latest-debug.apk
      - name: Publish latest debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: Latest Android debug build #${{ github.run_number }}
          body: |
            Automated debug/test APK from commit ${{ github.sha }}.
            This is not a production-signed release.
          files: release-assets/latest-debug.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
